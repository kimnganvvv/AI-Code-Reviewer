<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Code Reviewer</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1>AI Code Reviewer</h1>
    <p id="status" class="status">Hãy bôi đen code rồi chuột phải để review.</p>
  </header>

  <details id="code-box" class="code-box" hidden>
    <summary>Code đã nhận</summary>
    <pre id="code"></pre>
  </details>

  <section class="input-area">
    <textarea id="code-input" placeholder="Dán code Python vào đây" spellcheck="false"></textarea>
    <div class="input-actions">
      <button id="btn-analyze" type="button">Phân tích</button>
      <button id="btn-clear" type="button">Xoá</button>
      <a id="open-web" href="#" target="_blank" rel="noopener">Mở bản đầy đủ trên Web</a>
    </div>
  </section>

  <section class="controls">
    <label>Chế độ review
      <select id="mode-select">
        <option value="bandit">Bandit</option>
        <option value="llm">LLM</option>
        <option value="hybrid" selected>Hybrid</option>
      </select>
    </label>
    <p id="mode-hint" class="hint" hidden></p>
  </section>

  <section class="filters">
    <label>Mức nghiêm trọng
      <select id="filter-severity">
        <option value="all">Tất cả</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </label>
    <label>Độ tin cậy
      <select id="filter-confidence">
        <option value="all">Tất cả</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </label>
  </section>

  <p id="summary" class="summary"></p>
  <main id="issues"></main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
