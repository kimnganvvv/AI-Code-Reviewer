<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Code Reviewer</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Status Bar (sticky top) -->
  <header class="status-bar" role="status" aria-live="polite">
    <span id="backend-status" class="status-pill" title="Nhấp để kiểm tra lại kết nối">
      <span class="dot"></span>
      <span id="backend-status-text">Đang kiểm tra backend...</span>
    </span>
    <a id="open-web" class="open-web-btn" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      <span>Mở bản đầy đủ</span>
    </a>
  </header>

  <main class="main-content">
    <!-- Input Section -->
    <section class="input-section" aria-labelledby="input-label">
      <label id="input-label" class="input-label">Code Python cần review</label>

      <div class="textarea-wrapper">
        <textarea id="code-input" placeholder="Dán code Python vào đây" spellcheck="false" rows="10" wrap="off" aria-describedby="code-meta"></textarea>
        <div id="code-meta" class="code-meta" aria-live="polite">
          <span id="code-stats">0 dòng · 0 / 20.000 ký tự</span>
          <span id="code-hint" class="hint" hidden></span>
        </div>
      </div>

      <div class="mode-section" aria-labelledby="mode-label">
        <label id="mode-label" class="mode-label">Chế độ review</label>
        <p id="mode-desc" class="mode-desc">Hybrid: Bandit + LLM — ít báo nhầm hơn, bắt thêm lỗi bug/quality</p>
        <div class="segmented" role="radiogroup" aria-label="Chế độ review">
          <button type="button" class="segment" role="radio" aria-checked="false" data-mode="bandit" aria-label="Bandit — Chỉ SAST, nhanh, không cần API key">
            <span>Bandit</span>
            <span class="segment-desc">Chỉ SAST</span>
          </button>
          <button type="button" class="segment" role="radio" aria-checked="false" data-mode="llm" aria-label="LLM — Chỉ AI, tìm bug/quality">
            <span>LLM</span>
            <span class="segment-desc">Chỉ AI</span>
          </button>
          <button type="button" class="segment active" role="radio" aria-checked="true" data-mode="hybrid" aria-label="Hybrid (Khuyên dùng) — Bandit + LLM, ít báo nhầm hơn">
            <span>Hybrid <span class="badge-recommended">Khuyên dùng</span></span>
            <span class="segment-desc">Bandit + LLM</span>
          </button>
        </div>
        <p id="mode-hint" class="hint hint-warning" hidden></p>
      </div>

      <div class="action-row">
        <button id="btn-analyze" type="button" class="btn btn-primary">
          <span class="btn-text">Phân tích</span>
        </button>
        <button id="btn-cancel" type="button" class="btn btn-danger" hidden>Huỷ</button>
        <button id="btn-clear" type="button" class="btn btn-ghost">Xoá</button>
      </div>
    </section>

    <!-- Analyzing overlay (shows over textarea when analyzing) -->
    <div id="analyzing-overlay" class="analyzing-overlay" hidden aria-hidden="true">
      <div class="skeleton-card">
        <div class="skeleton-line long"></div>
        <div class="skeleton-line medium" style="margin-top:8px"></div>
        <div class="skeleton-line short" style="margin-top:8px"></div>
      </div>
      <div class="skeleton-card" style="margin-top:12px">
        <div class="skeleton-line long"></div>
        <div class="skeleton-line medium" style="margin-top:8px"></div>
        <div class="skeleton-line short" style="margin-top:8px"></div>
      </div>
      <div class="skeleton-card" style="margin-top:12px">
        <div class="skeleton-line long"></div>
        <div class="skeleton-line medium" style="margin-top:8px"></div>
        <div class="skeleton-line short" style="margin-top:8px"></div>
      </div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg class="icon-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="M9 12l2 2 4-4"></path>
        </svg>
      </div>
      <h3>Chưa có kết quả</h3>
      <p>Bôi đen code trên trang web, chuột phải rồi chọn <strong>"Review với AI Code Reviewer"</strong>, hoặc dán code vào ô trên.</p>
      <button id="btn-example" type="button" class="btn-link">Dùng code ví dụ</button>
    </div>

    <!-- Result Header (shown after analysis) -->
    <header id="result-header" class="result-header" hidden>
      <div class="result-summary">
        <span class="line1" id="result-summary-line1"></span>
        <span class="line2" id="result-summary-line2"></span>
      </div>
      <div class="result-actions">
        <button id="btn-edit-code" type="button" class="btn btn-ghost" hidden>Sửa code</button>
      </div>
    </header>

    <!-- Type Filter Chips -->
    <div id="type-chips" class="type-chips" hidden role="group" aria-label="Lọc theo loại lỗi">
      <label class="chip all" tabindex="0">
        <input type="checkbox" checked data-type="all" aria-label="Tất cả">
        <span>Tất cả</span>
        <span class="chip-count" id="chip-count-all">0</span>
      </label>
      <label class="chip security" tabindex="0">
        <input type="checkbox" checked data-type="security" aria-label="Security">
        <span>Security</span>
        <span class="chip-count" id="chip-count-security">0</span>
      </label>
      <label class="chip bug" tabindex="0">
        <input type="checkbox" checked data-type="bug" aria-label="Bug">
        <span>Bug</span>
        <span class="chip-count" id="chip-count-bug">0</span>
      </label>
      <label class="chip quality" tabindex="0">
        <input type="checkbox" checked data-type="quality" aria-label="Quality">
        <span>Quality</span>
        <span class="chip-count" id="chip-count-quality">0</span>
      </label>
    </div>

    <!-- Severity + Confidence Filters -->
    <section id="filter-section" class="filter-row" hidden aria-labelledby="filter-label">
      <div class="filter-select">
        <label for="filter-severity">Mức nghiêm trọng</label>
        <select id="filter-severity">
          <option value="all">Tất cả</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="filter-select">
        <label for="filter-confidence">Độ tin cậy</label>
        <select id="filter-confidence">
          <option value="all">Tất cả</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </section>

    <!-- Results count -->
    <div id="results-count" class="results-count" hidden aria-live="polite">
      Hiển thị <span id="results-shown">0</span> / <span id="results-total">0</span>
    </div>

    <!-- Banner area (for errors, warnings, success) -->
    <div id="banner-area" hidden></div>

    <!-- Issues List -->
    <section id="issues" aria-label="Danh sách lỗi"></section>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
