name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install matplotlib numpy  # for benchmark tests (plot_all)

      - name: Lint
        continue-on-error: true
        run: python -m ruff check backend || true

      - name: Type check
        continue-on-error: true
        run: python -m mypy backend/app || true

      - name: Run backend and benchmark tests
        run: python -m pytest backend/tests benchmark/tests

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --pull -t ai-code-reviewer:ci .

      - name: Start container
        run: docker run -d --name ai-code-reviewer-ci -p 127.0.0.1:8000:8000 -e USE_LLM=0 ai-code-reviewer:ci

      - name: Check health and Web UI
        run: |
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/

      - name: Stop container
        if: always()
        run: docker rm --force ai-code-reviewer-ci || true
